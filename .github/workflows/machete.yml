name: Machete

on:
  push:

jobs:
  machete:
    name: cargo machete
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install
      - run: |
          cargo install cargo-machete --locked
      - run: |
          cargo machete
